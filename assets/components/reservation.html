<div class="kc-loc-hero__card p-4 p-md-4 p-xl-4 text-start">
  <div class="mb-3 text-start">
    <div class="d-flex align-items-center justify-content-start gap-2 mb-1">
      <span class="badge bg-danger bg-opacity-10 text-danger text-uppercase fw-bold px-2 py-1" style="font-size: 0.7rem; letter-spacing: 0.08em;">Instant Booking</span>
    </div>
    <h2 class="h4 fw-bold text-dark text-start mb-1" style="font-family: 'Roboto Condensed', sans-serif;">
      Reserve Your Table
    </h2>
    <p class="small text-secondary text-start mb-0">
      Book your authentic coastal dining experience.
    </p>
  </div>

  <form id="kc-reservation-form" data-kc-form class="text-start">
    <!-- Hidden form identification -->
    <input type="hidden" name="form_name" value="location_reservation" />
    <input type="hidden" name="page_url" value="" />

    <div class="row g-2 g-md-3 text-start">
      <!-- Full Name -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Full Name</label>
        <input
          type="text"
          name="full_name"
          class="form-control"
          placeholder="Your Name"
          required
        />
      </div>

      <!-- Phone Number -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Phone Number</label>
        <input
          type="tel"
          name="phone"
          class="form-control"
          placeholder="Your Phone"
          required
        />
      </div>

      <!-- Email Address -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Email Address</label>
        <input
          type="email"
          name="email"
          class="form-control"
          placeholder="Your Email"
          required
        />
      </div>

      <!-- Preferred Location -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Location</label>
        <select class="form-select" name="location" required>
          <option value="" disabled selected>Select Branch</option>
          <option value="Kharghar">Kharghar (Sector 15)</option>
          <option value="Kopar Khairane">Kopar Khairane</option>
          <option value="Roadpali">Roadpali (Kalamboli)</option>
        </select>
      </div>

      <!-- Number of Guests -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Guests</label>
        <select class="form-select" name="guests" required>
          <option value="" disabled selected>Number of Guests</option>
          <option value="2">2 Guests</option>
          <option value="3">3 Guests</option>
          <option value="4">4 Guests</option>
          <option value="5">5 Guests</option>
          <option value="6+">6+ Guests (Party)</option>
        </select>
      </div>

      <!-- Preferred Date -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Date</label>
        <input
          type="date"
          name="booking_date"
          class="form-control"
          required
        />
      </div>

      <!-- Preferred Time -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Time</label>
        <select class="form-select" name="booking_time" required>
          <option value="" disabled selected>Select Time</option>
          <option value="11:30 AM">11:30 AM</option>
          <option value="12:00 PM">12:00 PM</option>
          <option value="12:30 PM">12:30 PM</option>
          <option value="01:00 PM">01:00 PM</option>
          <option value="01:30 PM">01:30 PM</option>
          <option value="02:00 PM">02:00 PM</option>
          <option value="02:30 PM">02:30 PM</option>
          <option value="03:00 PM">03:00 PM</option>
          <option value="07:00 PM">07:00 PM</option>
          <option value="07:30 PM">07:30 PM</option>
          <option value="08:00 PM">08:00 PM</option>
          <option value="08:30 PM">08:30 PM</option>
          <option value="09:00 PM">09:00 PM</option>
          <option value="09:30 PM">09:30 PM</option>
          <option value="10:00 PM">10:00 PM</option>
          <option value="10:30 PM">10:30 PM</option>
          <option value="11:00 PM">11:00 PM</option>
        </select>
      </div>

      <!-- Inquiry Type -->
      <div class="col-12 col-sm-6 text-start">
        <label class="form-label text-start d-block">Inquiry Type</label>
        <select class="form-select" name="inquiry_type">
          <option value="Table Reservation" selected>Table Reservation</option>
          <option value="Family Event">Family Celebration</option>
          <option value="Corporate Booking">Corporate Booking</option>
          <option value="Catering Query">Outdoor Catering</option>
        </select>
      </div>

      <!-- Special Requests -->
      <div class="col-12 text-start">
        <label class="form-label text-start d-block">Special Requests</label>
        <textarea
          class="form-control"
          name="message"
          rows="2"
          placeholder="Any dietary preferences or special occasion notes?"
        ></textarea>
      </div>

      <!-- Submit Button & Status Message -->
      <div class="col-12 pt-2 text-start">
        <button
          type="submit"
          class="kc-button kc-button--primary w-100 text-white border-0 py-2 d-flex justify-content-center align-items-center gap-2"
          style="font-size: 0.95rem; font-weight: 600;"
        >
          <span>Confirm Reservation</span>
          <i class="fa-solid fa-arrow-right small"></i>
        </button>

        <!-- Status Message Container -->
        <div class="kc-form-status mt-2 small text-start" style="min-height: 1.25rem;"></div>
      </div>
    </div>
  </form>
</div>
