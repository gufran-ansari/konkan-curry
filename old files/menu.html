<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore the Konkan Curry menu of coastal Indian dishes and restaurant favorites."
    />
    <title>Menu - Konkan Curry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="kc-body page-menu">
    <div class="kc-page-wrapper">
      <div data-component-src="assets/components/header.html"></div>

      <main id="page-content" class="kc-page-main">
        <section class="kc-page-hero container text-center py-5 mt-5">
          <p class="kc-page-hero__eyebrow text-uppercase tracking-wider fw-bold text-secondary mb-2">Menu</p>
          <h1 class="display-4 fw-bold mb-4">Coastal Indian Classics</h1>
          <p class="lead mx-auto" style="max-width: 600px;">
            A focused collection of dishes built for generous tables, refined
            service, and familiar Konkan flavor.
          </p>
        </section>

        <!-- Visual Gallery Marquee -->
        <section class="kc-visual-marquee bg-primary py-24 overflow-hidden" id="gallery-marquee">
          <div class="mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 mb-16 lg:mb-24">
            <div class="kc-hero-badge mb-4">
              <span class="kc-hero-badge__text">A Glimpse of the Coast</span>
            </div>
            <h2 class="display-3 fw-bold text-primary mb-4">Fresh from the net, served on your plate.</h2>
            <p class="text-secondary lead mb-0">Discover the vibrant colors and bold flavors of authentic Konkan cuisine.</p>
          </div>

          <div class="kc-marquee__container">
            <div class="kc-marquee__track">
              <!-- Set 1 -->
              <div class="kc-marquee__item">
                <img src="assets/images/starters.webp" alt="Coastal Starters" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/nonveg.webp" alt="Coastal Curry" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/signature-dishes.webp" alt="Signature Crab Masala" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/veg.webp" alt="Vegetarian Coastal Selection" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/celebration.webp" alt="Dining Moments" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/about.webp" alt="Culinary Heritage" class="kc-marquee__img">
              </div>
              <!-- Set 2 (for loop) -->
              <div class="kc-marquee__item">
                <img src="assets/images/starters.webp" alt="Coastal Starters" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/nonveg.webp" alt="Coastal Curry" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/signature-dishes.webp" alt="Signature Crab Masala" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/veg.webp" alt="Vegetarian Coastal Selection" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/celebration.webp" alt="Dining Moments" class="kc-marquee__img">
              </div>
              <div class="kc-marquee__item">
                <img src="assets/images/about.webp" alt="Culinary Heritage" class="kc-marquee__img">
              </div>
            </div>
          </div>
        </section>
      </main>

      <div data-component-src="assets/components/footer.html"></div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
