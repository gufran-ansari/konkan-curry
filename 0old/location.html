<!doctype html>
<html lang="en" class="light-mode">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      content="Konkan Curry is a luxury dining destination shaped around cinematic evenings, refined service, and a polished waterfront atmosphere."
      name="description"
    />
    <title>Konkan Curry - Our Locations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link href="assets/css/style.css" rel="stylesheet" />
    <style id="indexnew-component-overrides">
      :root {
        --font-family-global: "DM Sans", sans-serif;
        --font-family-heading: "Anton", sans-serif;
        --heading-weight: 700;
      }

      @keyframes logoSlideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .loc-card:hover img {
        transform: scale(1.06);
      }

      .loc-card:hover .loc-card-title {
        transform: translateY(0) !important;
        opacity: 1 !important;
      }

      .loc-card:hover .loc-card-arrow {
        opacity: 1 !important;
        transform: scale(1) !important;
      }

      @media (max-width: 640px) {
        #our-locations > div > div:last-child {
          grid-template-columns: 1fr !important;
        }

        #our-locations h2 {
          font-size: 18vw !important;
        }
      }
    </style>
    <!-- Flatpickr for premium dark-themed date/time pickers -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "clr-primary": "rgb(var(--clr-primary-rgb) / <alpha-value>)",
              "clr-dark": "rgb(var(--clr-dark-rgb) / <alpha-value>)",
              "clr-light": "rgb(var(--clr-light-rgb) / <alpha-value>)",
              primary: "rgb(var(--clr-primary-rgb) / <alpha-value>)",
              "on-primary": "rgb(var(--clr-light-rgb) / <alpha-value>)",
            },
            fontFamily: {
              heading: ["var(--font-family-heading)"],
              body: ["var(--font-family-global)"],
            },
            letterSpacing: {
              "ultra-wide": "0.25em",
            },
            animation: {
              "ken-burns": "kenburns 20s ease infinite alternate",
            },
            keyframes: {
              kenburns: {
                "0%": {
                  transform: "scale(1)",
                },
                "100%": {
                  transform: "scale(1.15)",
                },
              },
            },
          },
        },
      };
    </script>
  </head>

  <body class="bg-clr-dark text-white antialiased page-location">
    <!-- Premium Logo-Reveal Preloader (Hardcoded for instant load) -->
	<div data-component-src="assets/components/preloader.html"></div>
    <div data-component-src="assets/components/header.html"></div>

    <main id="page-content">
      <!-- ══════════════════ REDESIGNED IMMERSIVE HERO ══════════════════ -->
      <section class="location-hero-immersive" aria-labelledby="location-page-title">
        <!-- Background Image -->
        <div class="location-hero-immersive__bg">
          <img src="assets/images/location-hero-3.webp" alt="Konkan Curry Ambience" />
        </div>

        <!-- Scrim Overlay -->
        <div class="location-hero-immersive__overlay"></div>

        <!-- Content -->
        <div class="subpage-hero__content">
          <div class="subpage-hero__text">
            <nav aria-label="Breadcrumb">
              <ol class="subpage-hero__breadcrumb-list">
                <li>
                  <a href="index.html" class="subpage-hero__breadcrumb-link">Home</a>
                </li>
                <li class="subpage-hero__breadcrumb-separator" aria-hidden="true">/</li>
                <li>
                  <span class="subpage-hero__breadcrumb-current" aria-current="page">Location</span>
                </li>
              </ol>
            </nav>
            <h1 class="subpage-hero__title" id="location-page-title">
              Visit One of Our <em>Destinations</em>
            </h1>
            <p class="subpage-hero__description">
              Explore our diverse locations across Navi Mumbai and Thane. Each space is designed to offer a unique cinematic dining experience.
            </p>
          </div>
        </div>
      </section>

      <div class="location-page">
        <section class="py-4 md:py-16 bg-clr-dark">
          <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              <!-- Seawoods -->
              <a class="location-card" href="location/seawoods.html">
                <img
                  src="assets/images/location-seawoods.webp"
                  alt="Konkan Curry Seawoods"
                  class="location-card__bg"
                />
                <div class="location-card__overlay"></div>
                <div class="location-card__content">
                  <h4 class="location-card__title">Seawoods</h4>
                  <div class="location-card__btn">
                    <i class="bi bi-arrow-right"></i>
                  </div>
                </div>
              </a>

              <!-- Vashi -->
              <a class="location-card" href="location/vashi.html">
                <img
                  src="assets/images/location-vashi.webp"
                  alt="Konkan Curry Vashi"
                  class="location-card__bg"
                />
                <div class="location-card__overlay"></div>
                <div class="location-card__content">
                  <h4 class="location-card__title">Vashi</h4>
                  <div class="location-card__btn">
                    <i class="bi bi-arrow-right"></i>
                  </div>
                </div>
              </a>

              <!-- Thane -->
              <a class="location-card" href="location/thane.html">
                <img
                  src="assets/images/location-thane.webp"
                  alt="Konkan Curry Thane"
                  class="location-card__bg"
                />
                <div class="location-card__overlay"></div>
                <div class="location-card__content">
                  <h4 class="location-card__title">Thane</h4>
                  <div class="location-card__btn">
                    <i class="bi bi-arrow-right"></i>
                  </div>
                </div>
              </a>

              <!-- Vasai -->
              <a class="location-card" href="location/vasai.html">
                <img
                  src="assets/images/location-vasai.webp"
                  alt="Konkan Curry Vasai"
                  class="location-card__bg"
                />
                <div class="location-card__overlay"></div>
                <div class="location-card__content">
                  <h4 class="location-card__title">Vasai</h4>
                  <div class="location-card__btn">
                    <i class="bi bi-arrow-right"></i>
                  </div>
                </div>
              </a>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div data-component-src="assets/components/footer.html"></div>

    <!-- Light/Dark Mode Toggle -->
    <button
      id="theme-toggle"
      class="fixed bottom-6 right-6 z-[1000] flex h-12 w-12 items-center justify-center rounded-full bg-clr-primary text-clr-dark shadow-[0_4px_15px_rgba(0,0,0,0.5)] transition-transform hover:scale-110"
      aria-label="Toggle Light/Dark Mode"
    >
      <i class="bi bi-moon-stars-fill text-xl" id="theme-icon"></i>
    </button>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
