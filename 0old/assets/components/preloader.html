<!-- Premium Logo-Reveal Preloader -->
<div
  id="preloader"
  class="fixed inset-0 z-[200] flex flex-col items-center justify-center overflow-hidden"
  style="background: var(--clr-dark); opacity: 1"
>
  <div class="relative flex flex-col items-center gap-8 max-w-sm w-full px-8">
    <div
      class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 rounded-full blur-[120px]"
      style="background: rgb(var(--clr-primary-rgb) / 0.15)"
    ></div>
    <div style="overflow: hidden">
      <img
        id="preloader-logo"
        src="/assets/images/logo.svg"
        alt="Konkan Curry"
        style="
          height: 4rem;
          width: auto;
          object-fit: contain;
          animation: logoSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        "
      />
    </div>
    <p
      id="preloader-text"
      style="
        font-family: &quot;Inter&quot;, sans-serif;
        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4em;
        color: rgb(var(--clr-primary-rgb) / 0.6);
        animation: fadeIn 0.6s ease 0.9s both;
        margin: 0;
      "
    >
      Loading
    </p>
    <div
      style="
        width: 100%;
        height: 1px;
        background: rgb(var(--clr-light-rgb) / 0.08);
        border-radius: 9999px;
        overflow: hidden;
      "
    >
      <div
        id="preloader-bar"
        style="
          height: 100%;
          width: 0%;
          background: var(--clr-primary);
          transition: width 0.3s ease-out;
          box-shadow: 0 0 12px rgb(var(--clr-primary-rgb) / 0.5);
        "
      ></div>
    </div>
    <div
      style="
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-top: -0.5rem;
      "
    >
      <span
        style="
          font-family: &quot;Inter&quot;, sans-serif;
          font-size: 8px;
          text-transform: uppercase;
          letter-spacing: 0.3em;
          color: rgb(var(--clr-light-rgb) / 0.15);
        "
        >Konkan Curry</span
      >
      <span
        id="preloader-percent"
        style="
          font-family: &quot;Inter&quot;, sans-serif;
          font-size: 8px;
          text-transform: uppercase;
          letter-spacing: 0.3em;
          color: rgb(var(--clr-light-rgb) / 0.15);
        "
        >0%</span
      >
    </div>
  </div>
</div>
