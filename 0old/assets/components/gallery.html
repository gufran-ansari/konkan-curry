<section
  class="location-gallery-zoom"
  id="location-gallery-zoom"
  aria-labelledby="location-gallery-zoom-title"
>
  <div class="location-gallery-zoom__pin" data-location-gallery-pin>
    <div class="location-gallery-zoom__inner">
      <header class="location-gallery-zoom__header section-intro">
        <span class="section-tag">Spatial Experience</span>
        <h2 class="section-title" id="location-gallery-zoom-title">
          Nine frames recede until one cinematic view takes over.
        </h2>
      </header>

      <div class="location-gallery-zoom__canvas">
        <div class="location-gallery-grid" data-gallery-grid>
          <figure
            class="location-gallery-tile location-gallery-tile--1"
            data-gallery-tile
          >
            <img
              src="/assets/images/about.webp"
              alt="Konkan Curry interior detail"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--2"
            data-gallery-tile
          >
            <img
              src="/assets/images/signature-dishes.webp"
              alt="Table spread at Konkan Curry"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--3"
            data-gallery-tile
          >
            <img
              src="/assets/images/Untitled%20Folder%202/hero1.webp"
              alt="Signature dining atmosphere at Konkan Curry"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--4"
            data-gallery-tile
          >
            <img
              src="/assets/images/nonveg.webp"
              alt="Plated seafood speciality at Konkan Curry"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--5"
            data-gallery-tile
          >
            <img
              src="/assets/images/premium_restaurant_interior_blurred.webp"
              alt="Ambient interior light composition at Konkan Curry"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--6"
            data-gallery-tile
          >
            <img
              src="/assets/images/Untitled%20Folder%202/hero2.webp"
              alt="Dining room perspective at Konkan Curry"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--7"
            data-gallery-tile
          >
            <img
              src="/assets/images/dessert.webp"
              alt="Dessert presentation at Konkan Curry"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--8"
            data-gallery-tile
          >
            <img
              src="/assets/images/veg.webp"
              alt="Vegetarian signature dish at Konkan Curry"
            />
          </figure>

          <figure
            class="location-gallery-tile location-gallery-tile--9"
            data-gallery-tile
          >
            <img
              src="/assets/images/Untitled%20Folder%202/hero3.webp"
              alt="Konkan Curry evening interior scene"
            />
          </figure>
        </div>

        <figure class="location-gallery-focus" data-gallery-focus>
          <img
            src="/assets/images/location.webp"
            alt="Main Thane destination focus image"
          />
        </figure>
      </div>
    </div>

    <div
      class="location-gallery-expansion"
      data-gallery-expansion
      aria-hidden="true"
    >
      <img src="/assets/images/location.webp" alt="" />
    </div>
  </div>
</section>
